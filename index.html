let radarSort='priority'; function renderRadar(){const a=filtered();$('#radar').innerHTML=hero('Cada EJ,','no radar.',`A tabela combina performance individual, corte do ENEJ, ECM, SDE e qualidade de execução. Clique em qualquer EJ para abrir o perfil completo.`,a.length,'EJs no filtro atual')+`<div class="table-panel"><div class="table-toolbar"><p>Gap ENEJ individual = 8/12 da meta anual − faturamento atual. “Verde” usa a regra da BASE em 66%.</p><select id="radarSort" class="control"><option value="priority">Prioridade gerencial</option><option value="gap">Maior gap ENEJ</option><option value="revenue">Maior faturamento</option><option value="ecm">Maior ECM</option><option value="name">Nome A-Z</option></select></div><div class="table-wrap"><table><thead><tr><th>#</th><th>EJ</th><th>Núcleo</th><th>Cl.</th><th>Faturamento</th><th>Meta anual</th><th>% anual</th><th>Gap ENEJ</th><th>Verde</th><th>ECM</th><th>SDE</th><th>CSAT</th><th>PI</th><th>Prioridade</th></tr></thead><tbody id="radarBody"></tbody></table></div></div>`;$('#radarSort').value=radarSort;$('#radarSort').onchange=e=>{radarSort=e.target.value;renderRadarBody()};renderRadarBody()}
function renderRadarBody(){let a=[...filtered()]; if(radarSort==='priority')a.sort((x,y)=>y.priorityScore-x.priorityScore);if(radarSort==='gap')a.sort((x,y)=>y.enejGap-x.enejGap);if(radarSort==='revenue')a.sort((x,y)=>y.revenue-x.revenue);if(radarSort==='ecm')a.sort((x,y)=>y.ecmPct-x.ecmPct);if(radarSort==='name')a.sort((x,y)=>x.name.localeCompare(y.name));$('#radarBody').innerHTML=a.map((x,i)=>`<tr data-open="${x.id}"><td>${String(i+1).padStart(2,'0')}</td><td class="tdname">${esc(x.name)}</td><td>${esc(x.nucleus.replace('Núcleo ',''))}</td><td>${x.cluster2026||'-'}</td><td>${moneyS(x.revenue)}</td><td>${moneyS(x.targetRevenue)}</td><td>${pct(x.revenuePct)} <span class="mini"><i style="width:${clamp(x.revenuePct)}%"></i></span></td><td>${moneyS(x.enejGap)}</td><td><span class="badge ${x.green?'green':'red'}">${x.green?'SIM':'NÃO'}</span></td><td>${pct(x.ecmPct)}</td><td><span class="badge ${x.sdeTracking==='SOBE'?'green':x.sdeTracking==='CAI'?'red':'amber'}">${esc(x.sdeTracking)}</span></td><td>${num(x.csat)} • ${pct(x.csatCoverage)}</td><td>${x.impactProjects}/${x.targetImpact||0}</td><td><span class="badge ${x.priorityBand==='Crítica'?'red':x.priorityBand==='Alta'?'amber':'green'}">${x.priorityBand} ${num(x.priorityScore)}</span></td></tr>`).join('');bindOpen()}
function renderSDE(){const network=DB.sdeNuclei.FEJESC||{}, names=['Núcleo Floripa','Núcleo Vale Boreal','Núcleo Corrente','Núcleo Potência'];const cai=all.filter(x=>x.sdeTracking==='CAI').sort((a,b)=>b.priorityScore-a.priorityScore);$('#sde').innerHTML=hero('Saldo de evolução,','sem maquiagem.',`O SDE pondera quantas EJs sobem e caem por cluster. Quanto mais negativo o saldo, maior a pressão para reverter quedas antes do fechamento.`,num(network.saldo),'saldo projetado FEJESC')+`<div class="sde-grid">${names.map(name=>{const d=DB.sdeNuclei[name]||{};return `<div class="sde-card"><h3>${esc(name)}</h3><div class="sde-val" style="color:${n(d.saldo)>=0?'var(--green)':'var(--red2)'}">${num(d.saldo)}</div><div class="dist"><div><b>${Math.round(n(d.caiPct)*100)}%</b><span>CAI</span></div><div><b>${Math.round(n(d.permPct)*100)}%</b><span>PERM.</span></div><div><b>${Math.round(n(d.sobePct)*100)}%</b><span>SOBE</span></div></div></div>`}).join('')}</div><div class="section-head"><span>01</span><h2>EJs puxando o saldo para baixo</h2></div><div class="table-panel"><div class="table-wrap"><table style="min-width:1000px"><thead><tr><th>#</th><th>EJ</th><th>Núcleo</th><th>Cluster</th><th>Tracking</th><th>Faturamento</th><th>% Meta</th><th>ECM</th><th>Gap ENEJ</th><th>Prioridade</th></tr></thead><tbody>${cai.map((x,i)=>`<tr data-open="${x.id}"><td>${i+1}</td><td class="tdname">${esc(x.name)}</td><td>${esc(x.nucleus)}</td><td>${x.cluster2026}</td><td><span class="badge red">CAI</span></td><td>${moneyS(x.revenue)}</td><td>${pct(x.revenuePct)}</td><td>${pct(x.ecmPct)}</td><td>${moneyS(x.enejGap)}</td><td>${num(x.priorityScore)}</td></tr>`).join('')}</tbody></table></div></div>`;bindOpen()}
function renderWar(){const crit=[...all].sort((a,b)=>b.priorityScore-a.priorityScore).slice(0,18);const opp=DB.war.filter(x=>x.name && x.name!=='Total').sort((a,b)=>n(b.meta)-n(a.meta));const totalPotential=opp.reduce((s,x)=>s+n(x.potential),0);$('#war').innerHTML=hero('Onde atacar,','primeiro.',`Sala de guerra combina um ranking gerencial calculado com as oportunidades e observações registradas na aba METAS ENEJ. O objetivo é transformar gap em fila de ação.`,crit.filter(x=>x.priorityBand==='Crítica').length,'EJs em prioridade crítica')+`<div class="war-grid"><div class="panel"><div class="panel-head"><div><h3>Fila de aceleração</h3><p>50% gap pré-ENEJ, 25% gap ECM para 70%, 20% pressão de SDE e 5% ausência de coleta CSAT.</p></div><span class="chip">score gerencial</span></div><div class="priority-list">${crit.map((x,i)=>`<div class="priority" data-open="${x.id}"><div class="rank">${String(i+1).padStart(2,'0')}</div><div><h4>${esc(x.name)}</h4><p>${esc(x.nucleus)} • ${x.sdeTracking} • gap ${moneyS(x.enejGap)} • ECM ${pct(x.ecmPct)}</p></div><b class="${x.priorityBand==='Crítica'?'bad':x.priorityBand==='Alta'?'warn':'ok'}">${num(x.priorityScore)}</b></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><div><h3>Plano registrado na planilha</h3><p>Metas e anotações táticas extraídas diretamente da aba METAS ENEJ.</p></div><span class="chip">potencial explícito ${moneyS(totalPotential)}</span></div><div class="opp-list">${opp.map(x=>`<div class="opp"><h4>${esc(x.name)} • ${esc(x.nucleus.replace('Núcleo ',''))}</h4><div class="amt">Alvo/necessidade: ${moneyS(x.meta)}${x.potential?` • possibilidade ${moneyS(x.potential)}`:''}</div>${x.note?`<p>${esc(x.note)}</p>`:''}</div>`).join('')}</div></div></div>`;bindOpen()}
function renderMethod(){const L=DB.levels[level];$('#method').innerHTML=hero('O cálculo precisa','ser auditável.',`Todas as regras abaixo foram reproduzidas a partir das fórmulas e cortes da planilha de Aceleração FEJESC. Indicadores gerenciais adicionais estão marcados como não oficiais.`,98,'campos na BASE')+`<div class="method-grid"><div class="formula"><h3>1. EJ no verde</h3><code>FATURAMENTO &gt;= 0,66 × META_DE_FATURAMENTO</code><p>Regra encontrada na coluna “NO VERDE?” da BASE. É diferente da referência individual pré-ENEJ de 8/12.</p></div><div class="formula"><h3>2. Meta individual pré-ENEJ</h3><code>META_ENEJ = META_ANUAL / 12 × 8</code><p>Aba METAS ENEJ. O gap individual exibido no Radar usa essa referência de 66,67%.</p></div><div class="formula"><h3>3. ECM</h3><code>ECM = % DE MEMBROS ENGAJADOS / META DE ENGAJAMENTO</code><p>No desafio, contam-se EJs com ECM ≥ 50% no Nível 1 e ≥ 70% no Nível 2. Meta consolidada: 32 EJs.</p></div><div class="formula"><h3>4. Saldo de Evolução</h3><code>0,30×(SOBE−CAI) C1 + 0,25×(SOBE−CAI) C2 + 0,15×(SOBE−CAI) C3/C4/C5</code><p>Fórmula usada na aba de tracking de SDE. O objetivo ENEJ foi interpretado pela própria planilha como quantidade de núcleos com saldo não negativo.</p></div><div class="formula"><h3>5. Índice de prontidão</h3><code>MÉDIA(MIN(progresso de cada meta; 100%))</code><p>Indicador gerencial criado neste BI. Não é nota oficial da FEJESC, Brasil Júnior ou ENEJ.</p></div><div class="formula"><h3>6. Score de prioridade</h3><code>50% gap ENEJ + 25% gap ECM + 20% SDE + 5% coleta CSAT</code><p>Serve apenas para ordenar esforço operacional. Quanto maior, mais urgente a EJ aparece na Sala de Guerra.</p></div></div><div class="section-head"><span>FONTE</span><h2>Origem e atualização</h2></div><div class="notice">Fonte: <b>${esc(DB.meta.source)}</b>. Base marcada como atualizada em 17/08 às 23h30. O dashboard é autocontido e não consulta APIs externas. Quando houver divergência entre células antigas e fórmulas atuais da planilha, este BI privilegia os valores e regras da BASE e do tracking mais recente.</div>`}
function openEJ(id){const x=all.find(e=>e.id===String(id));if(!x)return;const raw=Object.entries(x.raw).map(([k,v])=>`<div class="rawitem"><small>${esc(k)}</small><div>${esc(v===null||v===undefined||v===''?'Sem registro':v)}</div></div>`).join('');$('#drawerContent').innerHTML=`<div class="ejhero"><div class="eyebrow">${esc(x.nucleus)} • Cluster ${x.cluster2026||'-'}</div><h2>${esc(x.name)}</h2><p>${esc(x.city||'')} • ${esc(x.university||'Sem universidade')}<br>Última auditoria: ${esc(x.auditDate||'Sem registro')} • CNPJ ${esc(x.cnpj||'')}</p></div><div class="ej-kpis"><div class="ej-kpi"><small>Faturamento</small><b>${moneyS(x.revenue)}</b></div><div class="ej-kpi"><small>% anual</small><b>${pct(x.revenuePct)}</b></div><div class="ej-kpi"><small>Gap ENEJ</small><b>${moneyS(x.enejGap)}</b></div><div class="ej-kpi"><small>Verde</small><b class="${x.green?'ok':'bad'}">${x.green?'SIM':'NÃO'}</b></div><div class="ej-kpi"><small>ECM</small><b>${pct(x.ecmPct)}</b></div><div class="ej-kpi"><small>SDE</small><b>${esc(x.sdeTracking)}</b></div><div class="ej-kpi"><small>CSAT</small><b>${num(x.csat)} / ${pct(x.csatCoverage)}</b></div><div class="ej-kpi"><small>Projetos impacto</small><b>${x.impactProjects}/${x.targetImpact||0}</b></div><div class="ej-kpi"><small>Prioridade</small><b>${x.priorityBand} ${num(x.priorityScore)}</b></div></div><div class="section-head"><span>AÇÃO</span><h2>Leitura rápida</h2></div><div class="notice">${x.enejGap>0?`Faltam <b>${moneyS(x.enejGap)}</b> para a referência individual de 8/12 da meta anual.`:'A referência individual pré-ENEJ já foi superada.'} ${x.ecmPct<DB.levels[level].ecmThreshold?`ECM ainda está abaixo do corte do ${DB.levels[level].name}.`: 'ECM está acima do corte atual.'} Tracking de SDE: <b>${esc(x.sdeTracking)}</b>.</div><details class="raw"><summary>Todos os 98 campos da BASE</summary><div class="rawgrid">${raw}</div></details>`;$('#drawer').classList.add('open')}
function bindOpen(){$$('[data-open]').forEach(el=>el.onclick=()=>openEJ(el.dataset.open))}
function renderAll(){renderCommand();renderGoals();renderNuclei();renderRadar();renderSDE();renderWar();renderMethod()}
$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+b.dataset.screen).classList.add('active')});
const nucs=[...new Set(all.map(x=>x.nucleus))].sort();$('#nucleus').innerHTML+=[...nucs].map(x=>`<option>${esc(x)}</option>`).join('');$('#level').onchange=e=>{level=e.target.value;renderAll()};$('#nucleus').onchange=e=>{nucleus=e.target.value;renderAll()};$('#cluster').onchange=e=>{cluster=e.target.value;renderAll()};$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');
$('#export').onclick=()=>{const a=filtered();const cols=['id','name','nucleus','cluster2026','revenue','targetRevenue','revenuePct','enejTarget','enejGap','green','ecmPct','sdeTracking','csat','csatCoverage','priorityScore','priorityBand'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv=[cols.join(';'),...a.map(x=>cols.map(c=>q(x[c])).join(';'))].join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),ael=document.createElement('a');ael.href=u;ael.download='FEJESC_ENEJ_'+DB.levels[level].name.replace(' ','_')+'.csv';ael.click();URL.revokeObjectURL(u)};
renderAll();</script></body></html>
