<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEJESC Intelligence 2026</title>
<style>
:root{
 --bg:#090a0c; --bg2:#0e1014; --panel:#12151a; --panel2:#171a20; --line:#2a2e36;
 --text:#f7f7f5; --muted:#9197a2; --muted2:#656b75; --red:#e21d24; --red2:#ff3b41;
 --dark:#1c1f27; --green:#56d69a; --amber:#f0b94f; --blue:#75aaff; --white:#fff;
 --r:3px; --sidebar:238px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{min-height:100vh}
.sidebar{
 position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#0b0c0f;border-right:1px solid var(--line);
 padding:24px 18px 18px;display:flex;flex-direction:column;z-index:40
}
.brand{padding:3px 3px 26px;border-bottom:1px solid var(--line)}
.brand img{display:block;width:132px;height:auto}
.brand small{display:block;margin-top:12px;color:#6d727d;text-transform:uppercase;letter-spacing:.14em;font-size:9px;font-weight:800}
.side-nav{display:grid;gap:3px;margin-top:19px}
.nav-btn{
 display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;width:100%;padding:11px 10px;
 border:0;border-left:2px solid transparent;background:transparent;color:#7e848f;text-align:left;font-size:11px;font-weight:750
}
.nav-btn .n{font-size:9px;color:#4f555e;letter-spacing:.08em}
.nav-btn:hover{background:#111319;color:#fff}
.nav-btn.active{color:#fff;border-left-color:var(--red);background:linear-gradient(90deg,rgba(226,29,36,.12),transparent)}
.side-bottom{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
.side-bottom img{width:88px;opacity:.9;display:block;margin-bottom:14px}
.side-bottom p{font-size:9px;color:#5f6570;line-height:1.5;margin:0}
.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{
 position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr minmax(190px,280px) 180px 120px auto;
 gap:8px;align-items:center;padding:11px 24px;background:rgba(9,10,12,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)
}
.top-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#6d737d;font-weight:800}
.control{height:38px;border:1px solid var(--line);background:#101217;color:#fff;padding:0 10px;outline:none;border-radius:var(--r);font-size:11px}
.control:focus{border-color:#505762}
.btn{height:38px;border:1px solid var(--line);background:#121419;color:#ddd;padding:0 12px;border-radius:var(--r);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.btn:hover{border-color:#4a505a;color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:white}
.content{padding:34px 30px 64px;max-width:1680px;margin:auto}
.screen{display:none}.screen.active{display:block}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--red2);font-weight:900;margin-bottom:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:26px;align-items:end;padding:22px 0 31px;border-bottom:1px solid var(--line);margin-bottom:24px}
.hero h1{font-size:clamp(42px,5vw,76px);line-height:.92;letter-spacing:-.065em;margin:0;max-width:920px;font-weight:900}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:#8c929d;line-height:1.65;font-size:12px;max-width:770px;margin:18px 0 0}
.hero-side{border-left:1px solid var(--line);padding-left:18px}
.hero-side strong{display:block;font-size:36px;line-height:1;letter-spacing:-.05em}
.hero-side span{font-size:9px;color:#6c727c;text-transform:uppercase;letter-spacing:.12em}
.section-label{display:flex;align-items:center;gap:10px;margin:32px 0 14px}
.section-label .num{color:var(--red);font-size:10px;font-weight:900}
.section-label h2{font-size:16px;margin:0;letter-spacing:-.02em}
.section-label:after{content:"";height:1px;background:var(--line);flex:1}
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.kpi{min-height:116px;padding:16px 15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0e1014}
.kpi .label{font-size:8.5px;color:#6d737d;text-transform:uppercase;letter-spacing:.11em;font-weight:850}
.kpi .value{font-size:25px;font-weight:900;letter-spacing:-.045em;margin-top:15px}
.kpi .sub{font-size:9px;color:#737985;margin-top:6px;line-height:1.35}
.kpi.redline{box-shadow:inset 0 2px 0 var(--red)}
.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.panel{border:1px solid var(--line);background:var(--panel);padding:18px;border-radius:var(--r)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:17px}
.panel-head h3{font-size:13px;margin:0}
.panel-head p{font-size:9.5px;color:#6f7580;line-height:1.45;margin:5px 0 0}
.tag{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:#9da3ac;border:1px solid var(--line);padding:5px 7px;border-radius:2px;white-space:nowrap}
.bar-list{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(110px,180px) 1fr 88px;gap:10px;align-items:center}
.bar-name{font-size:10px;color:#b7bbc3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:5px;background:#242832}
.fill{height:100%;background:var(--red)}
.bar-val{text-align:right;font-size:10px;color:#ececec;font-variant-numeric:tabular-nums}
.band-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.band{padding:17px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0f1116}
.band b{font-size:26px;display:block;letter-spacing:-.04em}
.band span{font-size:9px;color:#777d88;line-height:1.35}
.callouts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.callout{padding:16px;border-top:2px solid var(--red);background:#111319}
.callout small{color:#6d737d;text-transform:uppercase;letter-spacing:.1em;font-size:8px;font-weight:900}
.callout strong{font-size:16px;display:block;margin:9px 0 7px;line-height:1.18}
.callout p{font-size:9px;color:#7b818c;line-height:1.48;margin:0}
.network-toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.network-toolbar h2{font-size:25px;letter-spacing:-.04em;margin:0}
.network-count{font-size:9px;color:#747a84;text-transform:uppercase;letter-spacing:.08em}
.ej-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.ej-card{border:1px solid var(--line);background:#0f1115;padding:15px;min-height:185px;transition:.15s;display:flex;flex-direction:column;position:relative}
.ej-card:hover{border-color:#545a65;background:#12151a;transform:translateY(-1px)}
.ej-card:before{content:"";position:absolute;left:-1px;top:-1px;height:31px;width:2px;background:var(--red)}
.ej-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ej-name{font-size:14px;font-weight:850;line-height:1.15;letter-spacing:-.02em}
.cluster{font-size:8px;color:#8c929d;border:1px solid var(--line);padding:4px 5px}
.ej-meta{font-size:9px;color:#656b75;margin-top:7px;line-height:1.45}
.ej-statline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:auto;padding-top:15px;border-top:1px solid #252931}
.ej-statline span{font-size:8px;color:#666c76;text-transform:uppercase;letter-spacing:.07em}
.ej-statline b{display:block;color:#eee;font-size:11px;margin-top:4px}
.ej-open{margin-top:12px;font-size:8px;color:#d8d8db;text-transform:uppercase;letter-spacing:.1em;font-weight:900}
.ej-open i{color:var(--red);font-style:normal}
.table-panel{border:1px solid var(--line);background:#0e1014;overflow:hidden}
.table-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.table-wrap{overflow:auto;max-height:690px}
table{border-collapse:collapse;width:100%;min-width:1280px}
th{position:sticky;top:0;z-index:2;background:#15181e;color:#747b86;font-size:8px;text-transform:uppercase;letter-spacing:.08em;padding:10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
td{padding:10px;border-bottom:1px solid #232730;color:#b7bcc5;font-size:9.5px;white-space:nowrap}
tbody tr:hover td{background:#14171c}
.td-name{font-weight:800;color:#fff;max-width:230px;white-space:normal}
.score-chip{font-weight:900;color:#fff}
.mini-progress{height:3px;width:58px;background:#282d36;display:inline-block;margin-left:7px;vertical-align:middle}
.mini-progress i{display:block;height:100%;background:var(--red)}
.rankbars{display:grid;gap:11px}
.rankbar{display:grid;grid-template-columns:24px minmax(120px,210px) 1fr 95px;gap:10px;align-items:center}
.rankbar .pos{font-size:9px;color:#4f555f}.rankbar .nm{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nucleus-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.nucleus-card{border:1px solid var(--line);background:#101217}
.nucleus-top{padding:18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}
.nucleus-top h3{font-size:22px;margin:0;letter-spacing:-.04em}
.nucleus-top p{font-size:9px;color:#707681;margin:7px 0 0}
.nucleus-big{font-size:31px;font-weight:900;letter-spacing:-.04em;text-align:right}
.nucleus-big span{display:block;font-size:8px;color:#707681;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.nucleus-stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.nucleus-stat{padding:13px;border-right:1px solid var(--line)}
.nucleus-stat:last-child{border-right:0}
.nucleus-stat b{display:block;font-size:14px}.nucleus-stat span{font-size:8px;color:#717781}
.nucleus-ejs{padding:14px;display:flex;flex-wrap:wrap;gap:6px}
.link-ej{border:1px solid #2a2f38;background:#15181e;color:#aeb3bd;padding:6px 8px;font-size:8px;border-radius:2px}
.link-ej:hover{border-color:#5a606c;color:#fff}
.indicator-groups{display:grid;gap:14px}
.indicator-group{border:1px solid var(--line);background:#0f1115}
.indicator-title{display:flex;justify-content:space-between;gap:10px;padding:14px 15px;border-bottom:1px solid var(--line)}
.indicator-title h3{font-size:12px;margin:0}.indicator-title span{font-size:8px;color:#686e78;text-transform:uppercase;letter-spacing:.1em}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.metric{padding:15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:92px}
.metric:nth-child(4n){border-right:0}
.metric .ml{font-size:8px;color:#6e7480;text-transform:uppercase;letter-spacing:.08em}
.metric .mv{font-size:19px;font-weight:900;letter-spacing:-.035em;margin-top:10px}
.metric .ms{font-size:8px;color:#696f79;margin-top:4px}
.quality-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quality{border:1px solid var(--line);background:#101217;padding:16px}
.quality-head{display:flex;justify-content:space-between;gap:8px;align-items:end}
.quality h4{font-size:11px;margin:0}.quality strong{font-size:17px}
.quality p{font-size:8.5px;color:#707681;line-height:1.45;min-height:25px}
.qbar{height:5px;background:#272c34;margin-top:12px}.qbar i{display:block;height:100%;background:var(--red)}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.back{background:none;border:0;color:#8a909a;font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:0}
.back:hover{color:#fff}
.detail-hero{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:30px;padding:20px 0 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.detail-hero h1{font-size:clamp(38px,5vw,72px);line-height:.92;letter-spacing:-.065em;margin:9px 0 12px}
.detail-info{font-size:10px;color:#7c828d;line-height:1.6;max-width:850px}
.detail-score{border-left:1px solid var(--line);padding-left:22px;display:flex;flex-direction:column;justify-content:center}
.detail-score .score-num{font-size:58px;font-weight:900;letter-spacing:-.07em;color:#fff}
.detail-score small{font-size:8px;color:#6f7580;text-transform:uppercase;letter-spacing:.1em}
.detail-score .bandtxt{font-size:9px;color:#ff777b;margin-top:9px}
.detail-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}
.detail-tab{border:0;border-bottom:2px solid transparent;background:transparent;color:#717782;padding:10px 13px;font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;white-space:nowrap}
.detail-tab.active{color:#fff;border-bottom-color:var(--red)}
.detail-view{display:none}.detail-view.active{display:block}
.profile-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.compare-grid{display:grid;gap:12px}
.compare-row{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center}
.compare-row span{font-size:8.5px;color:#858b95}.compare-row b{text-align:right;font-size:9px}
.compare-track{height:5px;background:#272c35;position:relative}.compare-track i{display:block;height:100%;background:var(--red)}.compare-track em{position:absolute;top:-4px;width:1px;height:13px;background:#fff;opacity:.65}
.data-section{border:1px solid var(--line);background:#0f1115;margin-bottom:10px}
.data-section h3{font-size:11px;margin:0;padding:13px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
.data-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.data-item{padding:12px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:74px}
.data-item:nth-child(4n){border-right:0}
.data-item .dl{font-size:7.5px;color:#666d77;text-transform:uppercase;letter-spacing:.08em;line-height:1.3}
.data-item .dv{font-size:12px;color:#f0f0f1;font-weight:750;margin-top:8px;word-break:break-word}
.data-item .dv.small{font-size:9.5px;font-weight:600;line-height:1.45}
.ods-list{display:grid;grid-template-columns:repeat(17,1fr);gap:4px;padding:14px}
.ods{height:34px;border:1px solid #303540;display:grid;place-items:center;font-size:8px;color:#5f6671;background:#14171c}
.ods.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:900}
.raw{border:1px solid var(--line);background:#0f1115}
.raw summary{padding:14px;cursor:pointer;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.raw-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.raw-item{padding:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.raw-item .rk{font-size:7px;color:#5d636d;line-height:1.25;word-break:break-word}
.raw-item .rv{font-size:9px;color:#b6bbc4;margin-top:6px;word-break:break-word}
.method{max-width:950px}.method h2{font-size:36px;letter-spacing:-.05em;margin:0 0 16px}.method p,.method li{font-size:11px;line-height:1.65;color:#858b95}.method ul{display:grid;gap:8px}
.logo-watermark{position:fixed;right:26px;bottom:18px;width:85px;opacity:.045;pointer-events:none;z-index:0}
.empty{padding:45px;text-align:center;color:#666d78;font-size:10px;border:1px solid var(--line)}
.notice{padding:12px 14px;border-left:2px solid var(--red);background:#12141a;color:#8b919b;font-size:9px;line-height:1.5;margin:12px 0}
@media(max-width:1300px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.ej-grid{grid-template-columns:repeat(3,1fr)}.metric-grid{grid-template-columns:repeat(3,1fr)}.metric:nth-child(4n){border-right:1px solid var(--line)}.metric:nth-child(3n){border-right:0}.data-grid{grid-template-columns:repeat(3,1fr)}.data-item:nth-child(4n){border-right:1px solid var(--line)}.data-item:nth-child(3n){border-right:0}}
@media(max-width:980px){
 :root{--sidebar:0px}.sidebar{position:relative;width:auto;height:auto;padding:14px 16px}.brand{border:0;padding:0;display:flex;justify-content:space-between;align-items:center}.brand img{width:108px}.brand small,.side-bottom{display:none}.side-nav{display:flex;overflow:auto;margin:13px -16px -14px;padding:0 16px;border-top:1px solid var(--line)}.nav-btn{min-width:max-content;grid-template-columns:22px 1fr;border-left:0;border-bottom:2px solid transparent}.nav-btn.active{border-bottom-color:var(--red)}
 .main{margin-left:0}.topbar{grid-template-columns:1fr 1fr 1fr;padding:9px 14px}.top-title,.topbar .btn{display:none}.content{padding:26px 16px 50px}.hero{grid-template-columns:1fr}.hero-side{border-left:0;border-top:1px solid var(--line);padding:14px 0 0}.grid-2,.profile-grid{grid-template-columns:1fr}.ej-grid{grid-template-columns:repeat(2,1fr)}.nucleus-grid{grid-template-columns:1fr}.quality-grid{grid-template-columns:repeat(2,1fr)}.detail-hero{grid-template-columns:1fr}.detail-score{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.raw-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
 .topbar{grid-template-columns:1fr}.topbar select{display:none}.hero h1{font-size:48px}.kpi-grid{grid-template-columns:repeat(2,1fr)}.callouts{grid-template-columns:1fr 1fr}.ej-grid{grid-template-columns:1fr}.band-grid{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr}.quality-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3n){border-right:1px solid var(--line)}.metric:nth-child(2n){border-right:0}.data-grid{grid-template-columns:repeat(2,1fr)}.data-item:nth-child(3n){border-right:1px solid var(--line)}.data-item:nth-child(2n){border-right:0}.raw-grid{grid-template-columns:1fr}.ods-list{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>
<body>
<div class="app">

function detailSummary(d,revB,conB,memB,engB){
 return `<div class="profile-grid"><div>
 <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
 ${kpi("Faturamento",moneyShort(d.revenue),`${pct(d.revenuePct)} da meta`,true)}${kpi("Contratos",d.contracts,`${d.finalizedContracts2026} finalizados em 2026`)}${kpi("Membros",d.members,`${pct(d.executingPct)} executando`)}
 ${kpi("Engajamento MEJ",pct(d.engagedPct),`${d.engagedMembers} membros engajados`)}${kpi("Projetos de impacto",d.impactProjects,`${pct(d.impactGoalPct)} da meta`)}${kpi("ODS",d.odsCount,`${d.odsContracts} contratos com ODS`)}
 </div>
 <div class="section-label"><span class="num">A</span><h2>Leitura rápida</h2></div>
 <div class="callouts">
  ${d.revenuePct>=100?`<div class="callout"><small>Revenue</small><strong>Meta atingida</strong><p>A EJ está em ${pct(d.revenuePct)} da meta de faturamento.</p></div>`:`<div class="callout"><small>Revenue</small><strong>${pct(d.revenuePct)} da meta</strong><p>Meta cadastrada: ${brl(d.targetRevenue)}.</p></div>`}
  <div class="callout"><small>Execução</small><strong>${pct(d.executingPct)} do time</strong><p>${d.executingMembers} de ${d.members} membros executaram contratos no mês.</p></div>
  <div class="callout"><small>Cliente</small><strong>${pct(d.csatCoverage)} de coleta CSAT</strong><p>${d.csatCoverage>0?`CSAT parcial ${num(d.csatPartial)}.`:"Sem evidência suficiente de CSAT."}</p></div>
  <div class="callout"><small>Rede</small><strong>${moneyShort(d.collabRevenue2026)} colaborativo</strong><p>${d.collabContracts} contratos com ação colaborativa registrados.</p></div>
 </div></div>
 <div class="panel"><div class="panel-head"><div><h3>Posição relativa na rede</h3><p>Percentil FEJESC e referência da mediana do núcleo.</p></div></div>
 <div class="compare-grid">
 ${compareRow("Faturamento",d.revenue,revB.percentile,revB.nmedian,moneyShort)}
 ${compareRow("Contratos",d.contracts,conB.percentile,conB.nmedian,num)}
 ${compareRow("Membros",d.members,memB.percentile,memB.nmedian,num)}
 ${compareRow("Engajamento",d.engagedPct,engB.percentile,engB.nmedian,pct)}
 </div>
 <div class="notice" style="margin-top:18px">A marca branca indica a mediana do núcleo. A barra vermelha mostra a posição percentil da EJ dentro de toda a FEJESC.</div>
 </div></div>`;
}
function compareRow(label,val,percentile,nmedian,fmt){return `<div class="compare-row"><span>${label}</span><div class="compare-track"><i style="width:${clamp(percentile)}%"></i><em style="left:50%" title="referência visual da mediana"></em></div><b>${fmt(val)}</b></div><div style="font-size:7px;color:#555c66;margin:-8px 0 3px 120px">Percentil ${num(percentile)} • mediana do núcleo ${fmt(nmedian)}</div>`}
function detailFinance(d){return `<div class="data-section"><h3>Receita e metas</h3><div class="data-grid">
 ${dataItem("Faturamento",brl(d.revenue))}${dataItem("Meta de revenue",brl(d.targetRevenue))}${dataItem("% da meta",pct(d.revenuePct))}${dataItem("Aguardando 2ª auditoria",brl(d.pendingRevenue))}
 ${dataItem("Contratos",d.contracts)}${dataItem("Soluções",d.solutions)}${dataItem("Ticket médio",brl(d.ticketAvg))}${dataItem("Revenue por membro",brl(d.revenuePerMember))}
 ${dataItem("Contratos por membro",num(d.contractsPerMember))}${dataItem("Contratos finalizados",d.finalizedContracts)}${dataItem("Contratos finalizados em 2026",d.finalizedContracts2026)}${dataItem("Soluções finalizadas",d.finalizedSolutions)}
 </div></div><div class="data-section"><h3>Receita colaborativa</h3><div class="data-grid">
 ${dataItem("Faturamento colaborativo 2025",brl(d.collabRevenue2025))}${dataItem("Faturamento colaborativo 2026",brl(d.collabRevenue2026))}${dataItem("Meta de faturamento colaborativo",brl(d.targetCollabRevenue))}${dataItem("Progresso da meta colaborativa",d.targetCollabRevenue?pct(d.collabRevenueProgress):"Sem meta")}
 </div></div>`}
function detailPeople(d){return `<div class="data-section"><h3>Pessoas e execução</h3><div class="data-grid">
 ${dataItem("Membros",d.members)}${dataItem("Membros executando contratos",d.executingMembers)}${dataItem("% executando contratos",pct(d.executingPct))}${dataItem("Tempo médio por contrato",`${num(d.avgContractDays)} dias`)}
 ${dataItem("% membros com permanência de 1 ano",pct(d.oneYearRetentionPct))}${dataItem("Tempo de permanência no MEJ",num(d.lengthOfStay))}${dataItem("Meta length of stay",num(d.targetLengthOfStay))}${dataItem("% grupos subrepresentados",pct(d.subrepresentedPct))}
 </div></div><div class="data-section"><h3>Engajamento MEJ e D&I</h3><div class="data-grid">
 ${dataItem("Membros engajados com MEJ",d.engagedMembers)}${dataItem("% membros engajados",pct(d.engagedPct))}${dataItem("Meta membros engajados",num(d.targetEngagedMembers))}${dataItem("% da meta de engajamento",pct(d.engagedGoalPct))}
 ${dataItem("Políticas de D&I",num(d.diPolicies))}${dataItem("Meta de políticas D&I",num(d.targetDiPolicies))}${dataItem("% da meta de D&I",pct(d.diGoalPct))}${dataItem("Grupos subrepresentados",pct(d.subrepresentedPct))}
 </div></div>`}
function detailClient(d){return `<div class="data-section"><h3>CSAT</h3><div class="data-grid">
 ${dataItem("% coleta CSAT",pct(d.csatCoverage))}${dataItem("CSAT",num(d.csat))}${dataItem("Tracking CSAT",pct(d.csatTracking))}${dataItem("CSAT parcial",d.csatCoverage>0?num(d.csatPartial):"Sem coleta")}
 ${dataItem("Meta CSAT",num(d.targetCsat))}${dataItem("Soluções detratoras",d.csatDetractors)}${dataItem("Soluções neutras",d.csatNeutrals)}${dataItem("Soluções promotoras",d.csatPromoters)}
 </div></div><div class="data-section"><h3>NPS</h3><div class="data-grid">
 ${dataItem("% contratos coletados NPS",pct(d.npsCoverage))}${dataItem("Contratos coletados NPS",d.npsContracts)}${dataItem("NPS",d.npsCoverage>0?num(d.nps):"Sem coleta")}${dataItem("Tempo médio por contrato",`${num(d.avgContractDays)} dias`)}
 </div></div><div class="notice">Quando a cobertura de CSAT ou NPS é zero, o resultado numérico não deve ser interpretado isoladamente como experiência negativa.</div>`}
function detailImpact(d){return `<div class="data-section"><h3>Projetos de impacto e ODS</h3><div class="data-grid">
 ${dataItem("Projetos de impacto",d.impactProjects)}${dataItem("Meta de projetos de impacto",num(d.targetImpactProjects))}${dataItem("% da meta de PI",pct(d.impactGoalPct))}${dataItem("Número de ODS atingidas",d.odsCount)}
 ${dataItem("Contratos que atingem algum ODS",d.odsContracts)}${dataItem("Soluções que atingem algum ODS",d.odsSolutions)}
 </div><div class="ods-list">${Array.from({length:17},(_,i)=>`<div class="ods ${d.ods.includes(i+1)?"on":""}">${i+1}</div>`).join("")}</div></div>`}
function detailCollab(d){return `<div class="data-section"><h3>Ações colaborativas</h3><div class="data-grid">
 ${dataItem("Taxa de colaboração",pct(d.collabRate))}${dataItem("Meta collaborative rate",pct(d.targetCollabRate))}${dataItem("% da meta colaboração",pct(d.collabGoalPct))}${dataItem("Contratos com ação colaborativa",d.collabContracts)}
 ${dataItem("Agentes com ação colaborativa",d.collabAgentsCount)}${dataItem("Tipos de agentes",d.collabAgentTypes)}${dataItem("EJs com ação colaborativa",d.collabEJsCount)}${dataItem("Agentes registrados",esc(d.collabAgentsText||"Sem registro"),true)}
 </div></div><div class="data-section"><h3>Indicações recebidas</h3><div class="data-grid">
 ${dataItem("EJs pelas quais foi indicada",d.referredByEJsCount)}${dataItem("Contratos por indicação",d.referralContracts)}${dataItem("Soluções por indicação",d.referralSolutions)}${dataItem("Lista de EJs",esc(d.referredByEJs||"Sem registro"),true)}
 </div></div><div class="data-section"><h3>Indicações realizadas</h3><div class="data-grid">
 ${dataItem("EJs que indicou",d.referredEJsCount)}${dataItem("Contratos que indicou",d.referredContracts)}${dataItem("Soluções que indicou",d.referredSolutions)}${dataItem("Lista de EJs indicadas",esc(d.referredEJs||"Sem registro"),true)}
 </div></div>`}
function detailInstitutional(d){return `<div class="data-section"><h3>Cadastro e vínculo</h3><div class="data-grid">
 ${dataItem("CNPJ",esc(d.cnpj||"Sem registro"))}${dataItem("É federada",esc(d.federated||"Sem registro"))}${dataItem("Data de cadastro",dateBR(d.registrationDate))}${dataItem("Ano de federação",d.yearFederated||"Sem registro")}
 ${dataItem("Cluster 2025",d.cluster2025||"Sem registro")}${dataItem("Cluster 2026",d.cluster2026||"Sem registro")}${dataItem("Cluster 2027",d.cluster2027||"Sem registro")}${dataItem("Núcleo",esc(d.nucleus))}
 ${dataItem("Estado",esc(d.state||""))}${dataItem("Cidade",esc(d.city||""))}${dataItem("Universidade",esc(d.university||"Sem registro"),true)}${dataItem("Cursos",esc(d.courses||"Sem registro"),true)}
 </div></div><div class="data-section"><h3>Contato e auditoria</h3><div class="data-grid">
 ${dataItem("E-mail",d.email?`<a href="mailto:${esc(d.email)}">${esc(d.email)}</a>`:"Sem registro",true)}${dataItem("Site",linkValue(d.website),true)}${dataItem("Facebook",linkValue(d.facebook),true)}${dataItem("Data de coleta",dateBR(d.dataCollection))}
 ${dataItem("Última auditoria",dateBR(d.auditDate))}
 </div></div>`}
function detailRaw(d){return `<details class="raw" open><summary>Todos os ${DB.meta.fields} campos da linha original</summary><div class="raw-grid">${DB.meta.headers.map(h=>`<div class="raw-item"><div class="rk">${esc(h)}</div><div class="rv">${esc(d.raw[h]===null||d.raw[h]===undefined||d.raw[h]===""?"Sem registro":d.raw[h])}</div></div>`).join("")}</div></details>`}
init();
